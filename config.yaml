providers:
  qwen_token_plan:
    enabled: true
    type: local_tracking
    plan_name: "Qwen Token Plan Pro ($18/mo)"
    db_path: "~/.local/share/opencode/opencode.db"
    model_ids: ["qwen3.8-max-preview", "qwen3.7-max"]
    priority: 0
  zen_free:
    enabled: true
    type: local_tracking
    plan_name: "OpenCode Zen Free (DeepSeek/Laguna/Nemotron)"
    db_path: "~/.local/share/opencode/opencode.db"
    model_ids: ["deepseek-v4-flash-free", "laguna-s-2.1-free", "nemotron-3-ultra-free", "north-mini-code-free", "big-pickle", "mimo-v2.5-free"]
    priority: 1
  opencode_go:
    enabled: true
    base_url: "https://api.opencode.ai/zen/go/v1"
    priority: 1
  glm_pro:
    enabled: true
    base_url: "https://api.z.ai"
    priority: 2
  openrouter:
    enabled: true
    base_url: "https://openrouter.ai/api/v1"
    auth_path: "~/.local/share/opencode/auth.json"
    priority: 2
  claude_pro:
    enabled: true
    priority: 3
  kimi:
    enabled: false
    cli_path: "kimi"
    priority: 4
  gemini_pro:
    enabled: false
    priority: 5

cache:
  ttl_seconds: 300
  db_path: "~/.ai-usage-hub/cache.db"

server:
  http_port: 6737

scheduler:
  wait_threshold_percent: 85
  wait_max_minutes: 30
  delegate_threshold_percent: 85
  consolidate_threshold_percent: 70
  burn_rate_window_minutes: 15
