[project]
name = "ai-usage-hub"
version = "0.1.0"
description = "Local hub for AI subscription usage monitoring via MCP"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.0",
    "rich>=13.0",
    "aiohttp>=3.9",
    "pyyaml>=6.0",
]

[project.scripts]
ai-usage-hub = "server.main:main"
ai-usage-dashboard = "server.dashboard:main"

[tool.hatch.build.targets.wheel]
packages = ["server", "collectors"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
